<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./csss/pracc.css" ; />

  <body>
    <div class="header">
      <div class="left-section">
        <img class="hamburger-icon" src="./icons/hamburger-menu.svg" />
        <img class="youtube-logo" src="./icons/youtube-logo.svg" />
      </div>

      <div class="middle-section">
        <input class="search-bar" type="text" placeholder="Search" />
        <button class="search-icon-button">
          <img class="search-icon-image" src="./icons/search.svg" />
        </button>
        <button class="voicesearch-icon-button">
          <img
            class="voicesearch-icon-image"
            src="./icons/voice-search-icon.svg"
          />
        </button>
      </div>

      <div class="right-section">
        <img class="upload-icon" src="./icons/upload.svg" />
        <img class="youtube-apps-icon" src="./icons/youtube-apps.svg" />
        <img class="notifications-icon" src="./icons/notifications.svg" />
        <img class="profile-icon" src="./imagess/channel-7.jpeg" />

      </div>
    </div>
