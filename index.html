    <div class="header">

      </div>

      <div class="middle-section">
        <input class="search-bar" type="text" placeholder="Search" />

          Search

          />

          </div>
        </button>
        
      </div>

      <div class="right-section">

        </div>

          <div class="toolkit">
            YouTube apps
          </div>
        </div>
        <div class="notifications-icon-div toolkit-icons">
          <img class="notifications-icon" src="./icons/notifications.svg" />
          <div class="notifications-count">
            3
          </div>
          <div class="toolkit">
            Notifications
          </div>
        </div>
        <div class="profile-icon-div toolkit-icons">
          <img class="profile-icon" src="./imagess/channel-7.jpeg" />
        </div>

      </div>
    </div>


    <div class="sidebar">
      <div class="sidebar-link">
        <img class="toolkit" src="./icons/home.svg">
        <div class="sidebar-icons-title">
          Home
        </div>
      </div>
      <div class="sidebar-link">
        <img class="toolkit" src="./icons/explore.svg">

        </div>
      </div>
      <div class="sidebar-link">
        <img class="toolkit" src="./icons/subscriptions.svg">
        <div class="sidebar-icons-title">
          Subscriptions
        </div>
      </div>
      <div class="sidebar-link">
        <img class="toolkit" src="./icons/originals.svg">
        <div class="sidebar-icons-title">
          Originals
        </div>
      </div>
      <div class="sidebar-link">
        <img class="toolkit" src="./icons/youtube-music.svg">
        <div class="sidebar-icons-title">
          YouTube Music
        </div>
      </div>
      <div class="sidebar-link">
        <img class="toolkit" src="./icons/library.svg">
        <div class="sidebar-icons-title">
          Library
        </div>
      </div>
    </div>
